<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050608">
<meta name="robots" content="noindex, nofollow">
<title>Nocturne Systems — Under Maintenance</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050608;color:#f5f5f7;font-family:Inter,Arial,Helvetica,sans-serif}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,rgba(98,104,120,.11),transparent 48%),repeating-linear-gradient(90deg,transparent 0 89px,rgba(255,255,255,.018) 90px),repeating-linear-gradient(0deg,transparent 0 89px,rgba(255,255,255,.012) 90px)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px);background-size:157px 139px;background-position:35px 21px}
main{position:relative;z-index:1;text-align:center;padding:36px 24px;max-width:760px}
.emblem{width:82px;height:82px;margin:0 auto 25px;display:grid;place-items:center;border:1px solid #43464e;border-radius:50%;font:italic 900 58px Georgia,serif;letter-spacing:-.12em;padding-right:8px;box-shadow:0 0 55px rgba(255,255,255,.06)}
.brand{font-size:13px;letter-spacing:.42em;font-weight:800;margin:0 0 55px}
.kicker{font:700 11px ui-monospace,monospace;letter-spacing:.32em;color:#a5a7b1;margin-bottom:20px}
h1{font-size:clamp(44px,8vw,92px);letter-spacing:-.075em;line-height:.99;margin:0 0 25px;font-weight:900}
h1 span{color:#9196a2}
p{color:#a7aab5;line-height:1.7;font-size:15px;margin:0 auto;max-width:520px}
.line{width:70px;height:2px;background:#e8e9ed;margin:37px auto}
.status{font:700 11px ui-monospace,monospace;letter-spacing:.24em;color:#c9cbd2}
.dot{display:inline-block;width:7px;height:7px;background:#f1f2f4;border-radius:50%;margin-right:10px;box-shadow:0 0 12px #fff;vertical-align:middle}
@media(max-width:600px){.brand{margin-bottom:44px}.emblem{width:66px;height:66px;font-size:47px}p{font-size:14px}}
</style>
</head>
<body><main>
<div class="emblem" aria-hidden="true">N</div>
<div class="brand">NOCTURNE SYSTEMS</div>
<div class="kicker">/// SYSTEM STATUS · TEMPORARILY OFFLINE</div>
<h1>UNDER<br><span>MAINTENANCE.</span></h1>
<p>We're making improvements behind the scenes.<br>Our website is temporarily unavailable and will be back soon.</p>
<div class="line"></div>
<div class="status"><span class="dot"></span>MAINTENANCE IN PROGRESS</div>
</main></body></html>
