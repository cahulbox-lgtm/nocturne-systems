<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nocturne — Admin</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f4f4f5;font:14px Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{padding:22px 5%;border-bottom:1px solid #2e3036;display:flex;align-items:center;justify-content:space-between}h1{font-size:21px;letter-spacing:.12em}small,.muted{color:#9a9ba3}main{max-width:1180px;margin:36px auto;padding:0 20px}.panel{border:1px solid #35363c;background:#121318;border-radius:10px;padding:24px;margin:16px 0}input,textarea,select{display:block;width:100%;padding:13px;background:#090a0d;border:1px solid #454650;color:#fff;border-radius:5px;margin:8px 0 15px}textarea{min-height:380px;resize:vertical;font:12px/1.65 Consolas,monospace}label{display:block;font-weight:700}button{padding:12px 18px;border:1px solid #55575e;background:#22242a;color:white;border-radius:5px}button.primary{background:#f2f2f4;color:#111;border-color:#f2f2f4;font-weight:800}button:disabled{opacity:.5}nav{display:flex;gap:8px;flex-wrap:wrap}nav button.active{background:#eee;color:#111}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}#notice{min-height:24px;color:#bbb}code{color:#ddd}a{color:#fff}</style></head><body>
<header><h1>NOCTURNE <small>/ ADMIN</small></h1><a href="/">VIEW WEBSITE ↗</a></header><main><section id="login" class="panel"><h2>SECURE ADMIN ACCESS</h2><p class="muted">Sign in with the administrator account created in Supabase Authentication.</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="sign-in">SIGN IN</button></section>
<section id="dashboard" class="hidden"><div class="row" style="justify-content:space-between"><div><h2>CONTENT MANAGEMENT</h2><p class="muted">Changes are saved to the connected database and reflected on the public website.</p></div><button id="sign-out">SIGN OUT</button></div><nav id="tabs"></nav><div class="panel"><h3 id="heading"></h3><p id="help" class="muted"></p><label>Section data (JSON)<textarea id="editor" spellcheck="false"></textarea></label><div class="row"><button class="primary" id="save">SAVE & PUBLISH</button><button id="reload">RELOAD</button><button id="format">FORMAT JSON</button><button id="import">IMPORT EXISTING SITE DATA</button></div></div></section><p id="notice" role="status"></p></main>
<script>
let cfg,token='',content={},current='products';
const sections=['products','changelog','faq','support','announcements','media','settings'];
const help={products:'Array of catalog products. Edit names, prices, subtitles, descriptions and sections. Preserve existing product keys.',changelog:'Array of entries: [{"date":"04 NOV 2026","title":"...","description":"..."}].',faq:'Array of FAQ groups: [{"title":"PURCHASE & DELIVERY","questions":[{"question":"...","answer":"..."}]}].',support:'Object: {"title":"HOW CAN WE HELP?","description":"...","channel":"Discord Tickets","response":"Queue dependent","discordUrl":"https://discord.gg/..."}',announcements:'Array of announcement objects. Saved for future website display.',media:'Object mapping product names to arrays of media URLs. Use images already hosted in your repository or another trusted host.',settings:'Object: {"discordUrl":"https://discord.gg/..."}.'};
const el=id=>document.getElementById(id);const notify=s=>el('notice').textContent=s;
async function request(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})}});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
function render(){el('login').classList.toggle('hidden',!!token);el('dashboard').classList.toggle('hidden',!token);el('tabs').replaceChildren();for(const s of sections){const b=document.createElement('button');b.textContent=s.toUpperCase();b.classList.toggle('active',s===current);b.onclick=()=>{current=s;render()};el('tabs').append(b)}el('heading').textContent=current.toUpperCase();el('help').textContent=help[current];el('editor').value=JSON.stringify(content[current]??(current==='products'||current==='changelog'||current==='faq'||current==='announcements'?[]:{}),null,2);}
async function load(){const data=await request('/api/site-content');content=data.content||{};render();}
async function signIn(){try{notify('Signing in…');const r=await fetch(cfg.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.key},body:JSON.stringify({email:el('email').value,password:el('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Login failed');token=d.access_token;sessionStorage.setItem('ns-admin-token',token);await load();notify('Signed in.');}catch(e){notify(e.message)}}
el('import').onclick=async()=>{try{notify('Checking existing website content…');const seed=await request('/api/site-seed');const existing=await request('/api/site-content');const sections=['products','faq','changelog'];const available=sections.filter(s=>{const v=existing.content?.[s];return v===undefined||v===null||(Array.isArray(v)&&v.length===0)});if(!available.length){notify('Nothing to import: products, FAQ and changelog already contain data.');return}if(!confirm('Import existing website data into empty sections: '+available.join(', ')+'? Existing saved sections will not be overwritten.'))return;for(const section of available){await request('/api/site-content',{method:'PUT',body:JSON.stringify({section,data:seed.content[section]})});}await load();notify('Imported successfully: '+available.join(', ')+'.')}catch(e){notify('Import failed: '+e.message)}};
el('sign-in').onclick=signIn;el('sign-out').onclick=()=>{token='';sessionStorage.removeItem('ns-admin-token');render();notify('Signed out.');};el('reload').onclick=()=>load().then(()=>notify('Reloaded.')).catch(e=>notify(e.message));el('format').onclick=()=>{try{el('editor').value=JSON.stringify(JSON.parse(el('editor').value),null,2);notify('JSON formatted.')}catch(e){notify('Invalid JSON: '+e.message)}};
el('save').onclick=async()=>{try{const data=JSON.parse(el('editor').value);if(!confirm('Publish changes to '+current+'?'))return;await request('/api/site-content',{method:'PUT',body:JSON.stringify({section:current,data})});content[current]=data;notify('Saved and published: '+current+'.')}catch(e){notify(e.message)}};
(async()=>{try{cfg=await request('/api/admin-config');token=sessionStorage.getItem('ns-admin-token')||'';if(token){try{await load()}catch(e){token='';sessionStorage.removeItem('ns-admin-token');notify('Please sign in again.')}}render()}catch(e){notify('Setup required: '+e.message);el('sign-in').disabled=true}})();
</script></body></html>
